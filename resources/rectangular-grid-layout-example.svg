<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Rectangular fabric grids with two-centimetre edge margins</title><desc id="desc">Two diagrams at the same scale show a 140 by 100 centimetre fabric rectangle with a two-centimetre margin on all four edges, leaving 136 by 96 centimetres usable. The original 20 by 30 centimetre grid fits eighteen pieces. Turning every piece gives a 30 by 20 centimetre grid fitting sixteen. All gaps are zero. These two grids do not establish an optimal mixed layout. AI-assisted programmatic authorship by Sewlore. No physical testing was performed.</desc><metadata><![CDATA[AI-assisted programmatic authorship by Sewlore, 9 October 2026. Hypothetical mathematical example; no physical testing performed. Source tool: https://gokimedia.github.io/sewlore-sewing-tools/resources/rectangular-fabric-layout.html. Licensed under this repository's existing MIT License; no new Creative Commons licence is granted.
