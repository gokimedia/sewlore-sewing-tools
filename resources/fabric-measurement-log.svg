<svg xmlns="http://www.w3.org/2000/svg" width="190mm" height="250mm" viewBox="0 0 760 1000" role="img" aria-labelledby="title desc">
  <title id="title">Sewlore Fabric Measurement Log</title>
  <desc id="desc">Blank printable worksheet with fabric identification fields, three rows of starting, extended and released length measurements, care measurements in two directions, formulas and notes. This is a log sheet, not a calibrated ruler.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #21332c; font-size: 15px; }
      .brand { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #193c30; }
      .title { font-family: Georgia, serif; font-size: 35px; font-weight: 700; fill: #193c30; }
      .section { font-size: 18px; font-weight: 700; fill: #193c30; }
      .label { font-size: 13px; fill: #495b51; }
      .small { font-size: 12px; fill: #495b51; }
      .head { font-size: 12px; font-weight: 700; }
      .line { fill: none; stroke: #7b8b80; stroke-width: 1; }
    </style>
  </defs>
  <rect width="760" height="1000" fill="#fffefa"/>
  <text x="20" y="29" class="brand">SEWLORE · PROJECT NOTES</text>
  <text x="20" y="78" class="title">Fabric Measurement Log</text>
  <text x="20" y="109">Keep measurements, direction and conditions with your sample.</text>
  <text x="20" y="132">Use one unit consistently within each calculation.</text>

  <text x="20" y="172" class="section">Identify the sample</text>
  <text x="20" y="200" class="label">Fabric name or sample ID</text>
  <text x="400" y="200" class="label">Date</text>
  <path class="line" d="M20 228H355 M400 228H740"/>
  <text x="20" y="251" class="label">Fibre, structure or supplier notes</text>
  <text x="400" y="251" class="label">Project or pattern reference</text>
  <path class="line" d="M20 279H355 M400 279H740"/>
  <text x="20" y="302" class="label">Sample condition before measuring</text>
  <text x="400" y="302" class="label">Unit used throughout this record</text>
  <path class="line" d="M20 330H355 M400 330H740"/>

  <text x="20" y="370" class="section">Stretch and released length</text>
  <text x="20" y="395" class="small">Use a separate row for each direction or repeat. Record the time after release.</text>
  <rect x="20" y="412" width="720" height="44" fill="#eef2ec"/>
  <path class="line" d="M20 412H740V579H20Z M20 456H740 M20 497H740 M20 538H740 M140 412V579 M260 412V579 M380 412V579 M500 412V579 M620 412V579"/>
  <text x="28" y="431" class="head">Direction</text><text x="28" y="447" class="head">or repeat</text>
  <text x="148" y="431" class="head">Starting</text><text x="148" y="447" class="head">length</text>
  <text x="268" y="431" class="head">Extended</text><text x="268" y="447" class="head">length</text>
  <text x="388" y="431" class="head">Released</text><text x="388" y="447" class="head">length</text>
  <text x="508" y="431" class="head">Time after</text><text x="508" y="447" class="head">release</text>
  <text x="628" y="439" class="head">Observation</text>
  <path d="M20 598V659" stroke="#193c30" stroke-width="3"/>
  <text x="33" y="615" class="small">Stretch % = (extended − starting) ÷ starting × 100</text>
  <text x="33" y="636" class="small">Remaining extension % = (released − starting) ÷ starting × 100</text>
  <text x="33" y="657" class="small">Starting length must be greater than zero. Keep the sign of each result.</text>

  <text x="20" y="696" class="section">Measurements before and after care</text>
  <text x="20" y="722" class="label">Actual washing, drying and preparation method</text>
  <path class="line" d="M20 751H740"/>
  <rect x="20" y="766" width="720" height="32" fill="#eef2ec"/>
  <path class="line" d="M20 766H740V873H20Z M20 798H740 M20 836H740 M200 766V873 M380 766V873 M560 766V873"/>
  <text x="28" y="787" class="head">Direction</text>
  <text x="208" y="787" class="head">Before care</text>
  <text x="388" y="787" class="head">After care</text>
  <text x="568" y="787" class="head">Observation</text>

  <text x="20" y="906" class="section">Decision and next sample</text>
  <path class="line" d="M20 929H740 M20 951H740"/>
  <text x="20" y="978" class="small">Sewlore · Personal planning worksheet · v1 · October 2026 · sewlore.com</text>
  <text x="20" y="995" class="small">A sample log, not a fabric certification, garment fit assessment or calibrated ruler.</text>
</svg>
